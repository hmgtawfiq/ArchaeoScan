
name: ArchaeoScan Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Python files
        run: |
          python -m compileall backend

      - name: Test analysis modules
        working-directory: backend
        run: |
          python -c "from analysis.spectral import spectral_analysis; from analysis.temporal import temporal_analysis; from analysis.geometry import geometry_analysis; from analysis.scoring import calculate_final_score; print('ArchaeoScan engine OK')"
