name: TQ Archaeology Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Python files
        run: |
          python -m compileall backend

      - name: Test analysis modules
        working-directory: backend
        run: |
          python -c "from analysis.spectral import spectral_analysis; from analysis.temporal import temporal_analysis; from analysis.geometry import geometry_analysis; from analysis.scoring import calculate_final_score; print('ArchaeoScan engine OK')"

      - name: Test Copernicus authentication
        working-directory: backend
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          python -c "from satellite.copernicus import get_access_token; token=get_access_token(); print('Copernicus authentication OK')"

      - name: Test Sentinel-2 data request
        working-directory: backend
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          from satellite.copernicus import request_sentinel_data

          response = request_sentinel_data(
              latitude=33.7204130,
              longitude=36.5563628,
              radius_m=500,
              start_date="2026-08-01",
              end_date="2026-09-01",
              max_cloud=20,
          )

          print("Sentinel-2 data request OK")
          print("HTTP status:", response.status_code)
          print("Data size:", len(response.content), "bytes")
          PY

      - name: Start ArchaeoScan API
        working-directory: backend
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          echo $! > api.pid

          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "ArchaeoScan API is ready"
              exit 0
            fi

            sleep 1
          done

          echo "ArchaeoScan API failed to start"
          cat api.log
          exit 1

      - name: Test ArchaeoScan API
        working-directory: backend
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import requests

          response = requests.get(
              "http://127.0.0.1:8000/health",
              timeout=30,
          )

          response.raise_for_status()

          print("ArchaeoScan API test OK")
          print(response.text)
          PY


  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build TQ Archaeology APK
        run: |
          gradle -p android assembleDebug --no-daemon

      - name: Upload TQ Archaeology APK
        uses: actions/upload-artifact@v4
        with:
          name: tq-archaeology-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
